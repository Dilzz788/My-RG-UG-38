<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15803d">
<title>My RG-UG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">


<style>
*{box-sizing:border-box}
:root{--green:#15803d;--green2:#16a34a;--dark:#166534;--soft:#f0fdf4;--ink:#27332f;--muted:#71807b}
body{margin:0;background:#f3f8f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.wrap{width:100%;max-width:780px;margin:0 auto;padding:18px 20px}
.card{background:#fff;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #14532d0d}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--green);color:#fff;font-weight:700}
.btn.alt{background:#dcfce7;color:#166534}.btn.danger{background:#b42318}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
input,textarea,select{width:100%;padding:12px;border:1px solid #d9e4e0;border-radius:11px;margin:5px 0 10px;background:#fff}
textarea{min-height:90px;resize:vertical}.muted{color:var(--muted);font-size:13px}
.error{color:#b42318;font-size:13px;margin-bottom:8px}.stat{font-size:24px;font-weight:800}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e9e6;text-align:left;font-size:13px}

/* Header (semua elemen rata tengah) */
.app-top{color:#fff;overflow:hidden;background:linear-gradient(150deg,#14532d 0%,#166534 45%,#15803d 100%)}
.pattern{position:relative;padding:26px 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pattern:before{content:"";position:absolute;inset:-30px;opacity:.13;background-image:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 65%,#fff 0 2px,transparent 3px);background-size:45px 45px,62px 62px;transform:rotate(-8deg);pointer-events:none}
.pattern>*{position:relative}
.rolepill{background:#ffffff25;border:1px solid #ffffff55;border-radius:999px;padding:8px 14px;font-size:12px}
.top-login{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:999px;width:38px;height:38px;padding:0;display:grid;place-items:center}
.top-login svg{width:18px;height:18px}
.access{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.home-body{padding-top:14px}.qicon svg{width:23px;height:23px}.section-title{font-size:16px;font-weight:800;margin:16px 2px 10px}
.banner{background:linear-gradient(135deg,#dcfce7,#f0fdf4);border:1px solid #bbf7d0;border-radius:16px;padding:15px;margin:14px 0}
.banner b{color:#166534;font-size:17px}.banner small{display:block;color:#4d7c5f;margin-top:3px}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick{border:0;background:transparent;text-align:center;color:#46534e;padding:5px 2px;min-width:0}
.qicon{width:52px;height:52px;border-radius:50%;background:#dcfce7;margin:0 auto 7px;display:grid;place-items:center;color:#166534;box-shadow:inset 0 0 0 1px #bbf7d0;transition:.2s}
.quick b{display:block;font-size:12px;font-weight:600;line-height:1.25}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.info-grid .info-card:last-child:nth-child(odd){grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:0;padding:13px 14px}
.info-grid .info-card:last-child:nth-child(odd) .info-icon{margin-bottom:0}
.info-card{border:0;text-align:left;background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 13px #14532d0b;min-height:106px}
.info-icon{width:34px;height:34px;border-radius:10px;background:#dcfce7;color:#166534;display:grid;place-items:center;margin-bottom:8px}.info-icon svg{width:19px;height:19px}.info-card b{font-size:14px}.info-card small{display:block;color:var(--muted);margin-top:4px}
.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.media-card{background:#f7faf9;border:1px solid #e2ebe7;border-radius:14px;overflow:hidden}
.media-card img,.media-card video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#dfe9e5}
.media-meta{padding:9px}.media-meta b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-meta small{display:block;color:var(--muted);margin-top:3px}
.filebox{border:1.5px dashed #86efac;background:#f0fdf4;border-radius:14px;padding:14px;margin:10px 0}
.filebox input{border:0;background:transparent;padding:4px 0;margin:4px 0}
.login{max-width:430px;margin:9vh auto}.page-card{position:relative}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-right:0}.page-head h2{margin:0;font-size:21px}.inline-icon{display:inline-grid;vertical-align:-4px;margin-right:4px;color:#166534}.back-btn{flex:0 0 auto;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:10px;padding:8px 11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(20,83,45,.07)}.back-btn svg{width:17px;height:17px}
@media(max-width:370px){.wrap{padding-left:14px;padding-right:14px}.quick-grid{gap:8px}.qicon{width:46px;height:46px}.quick b{font-size:11px}.info-grid{gap:8px}}


/* Logo My RGUG: ikon logo dengan bingkai putih tipis di tengah header */
.logoIsland{
  width:104px;
  border-radius:29px;
  background:#fff;
  padding:4px;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  flex:0 0 auto;
  overflow:hidden;
}
.logoIsland svg{display:block;width:100%;height:auto}
.brand{margin:14px 0 0;font-family:"Poppins","Nunito","Quicksand",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:.4px;color:#fff}
.brand span{color:#86efac}
.brand-tag{margin-top:7px;font-size:10.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:#c8f5db;opacity:.85}
/* Jam real-time */
.clock{
  margin-top:14px;
  padding:9px 20px 10px;
  border-radius:16px;
  background:#ffffff1f;
  border:1px solid #ffffff40;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.clock-time{
  font-family:"Poppins",system-ui,sans-serif;
  font-size:30px;font-weight:700;line-height:1.15;
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
}
.clock-time small{font-size:12px;font-weight:600;letter-spacing:.5px;margin-left:6px;color:#bbf7d0}
.clock-date{font-size:12.5px;opacity:.92}
.item{background:#f8fbfa;border:1px solid #e4ece9;border-radius:13px;padding:12px;margin:9px 0;position:relative;overflow:hidden}.item b{font-size:14px}.item .muted{display:block;margin-top:4px}.notice{background:#fff8e7;border:1px solid #f4dfaa;border-radius:13px;padding:12px;margin:10px 0}.notice b{color:#8a5a00}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:700}.empty{padding:18px 8px;text-align:center;color:var(--muted)}
@media(max-width:430px){.wrap{padding:16px 18px}.logoIsland{width:92px}.brand{font-size:27px}.clock-time{font-size:27px}.rolepill{padding:6px 9px}.quick-grid{gap:10px}.qicon{width:50px;height:50px}}


/* Tombol hapus jadwal */
.btn.danger{
  position:relative;
  z-index:20;
  pointer-events:auto !important;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(180,35,24,.18);
  cursor:pointer;
}


/* ===== Animasi pembuka (splash) ===== */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,#f0fdf4 0,#fff 62%);
  animation:spOut .55s ease 3.15s forwards;-webkit-tap-highlight-color:transparent}
#splash.bye{animation:spOut .3s ease 0s forwards!important}
.sp-inner{--u:min(40vw,168px);display:flex;flex-direction:column;align-items:center;padding-bottom:5vh}
.sp-icon{width:var(--u);height:var(--u);display:block;overflow:visible;filter:drop-shadow(0 10px 22px rgba(21,128,61,.28))}
.sp-rect{transform-box:view-box;transform-origin:0 0;animation:spIcon .8s cubic-bezier(.2,.9,.25,1.15) .05s both}
.sp-spin{transform-box:view-box;transform-origin:0 0;animation:spSpin 1.15s cubic-bezier(.16,.84,.28,1) .5s both}
.sp-leaf{transform-box:view-box;transform-origin:0 0;animation:spLeaf .6s cubic-bezier(.2,.9,.3,1.2) both}
.sp-l1{animation-delay:.5s}.sp-l2{animation-delay:.65s}.sp-l3{animation-delay:.8s}
.sp-dot{transform-box:view-box;transform-origin:0 0;animation:spDot .5s cubic-bezier(.2,1.4,.4,1) .35s both}
.sp-wm{display:flex;align-items:flex-end;justify-content:center;margin-top:calc(var(--u)*0.1691)}
.sp-wm img{display:block;height:auto}
.sp-my{width:calc(var(--u)*0.4900);animation:spUp .55s ease 1.3s both}
.sp-rgug{width:calc(var(--u)*0.8781);animation:spUp .55s ease 1.5s both}
.sp-tag{display:block;width:calc(var(--u)*2.0653);max-width:88vw;height:auto;margin-top:calc(var(--u)*0.0457);animation:spUp .6s ease 2.05s both}
@keyframes spIcon{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes spSpin{from{transform:rotate(-200deg)}to{transform:rotate(0)}}
@keyframes spLeaf{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes spDot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden;transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){
  #splash{animation:spOut .4s ease 1.2s forwards}
  #splash *{animation:none!important}
}

/* ===== Titik merah: ada data baru ===== */
.info-card,.qicon{position:relative}
.ndot{position:absolute;top:12px;right:12px;width:12px;height:12px;border-radius:50%;background:#ef4444;
  box-shadow:0 0 0 2.5px #fff;animation:ndotPulse 1.8s ease-out infinite;pointer-events:none}
.qicon .ndot{top:-1px;right:-1px}
@keyframes ndotPulse{0%{box-shadow:0 0 0 2.5px #fff,0 0 0 2.5px rgba(239,68,68,.6)}
  70%{box-shadow:0 0 0 2.5px #fff,0 0 0 10px rgba(239,68,68,0)}100%{box-shadow:0 0 0 2.5px #fff,0 0 0 2.5px rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.ndot{animation:none}}

/* ===== Lampiran PDF pada arsip administrasi ===== */
.filechip{display:flex;align-items:center;gap:10px;margin:10px 0 6px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #bbf7d0}
.fc-ico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#dcfce7;color:#166534;display:grid;place-items:center}
.fc-ico svg{width:19px;height:19px}
.fc-txt{min-width:0}.fc-txt b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-txt small{display:block;color:var(--muted);margin-top:2px}
.pdfbtns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.pdfbtns .btn{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
.filebox .inline-icon,.picked .inline-icon{display:inline-flex;vertical-align:-3px;margin-right:4px}
.filebox .inline-icon svg,.picked .inline-icon svg{width:18px;height:18px}
.picked{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#166534;font-weight:600;margin-top:2px}
.picked:empty{display:none}
.linkbtn{border:0;background:transparent;color:#b42318;font-weight:700;padding:2px 4px;text-decoration:underline}
</style>
</head>

const bidang={
 admin:"idilgantengpican",
 ilan:"Bidang I'lan",
 tarbiyyah:"Bidang Tarbiyyah",
 dakwah:"Bidang Dakwah",
 tanmiyah:"Bidang Tanmiyah",
 bendahara:"Bendahara",
 sekretaris:"Sekretaris"
};
/* Login memakai Firebase Authentication. Username tanpa "@" otomatis diberi domain di bawah,
   misalnya "bendahara" -> bendahara@rgug.app. Bisa juga mengetik email lengkap. */
const EMAIL_DOMAIN="@rgug.app";
const userAlias={idilgantengpican:"admin"};   /* nama tampilan admin -> username admin */
let role="public";
let loginBusy=false;
let viewFn=null;
let data;
try{ data=JSON.parse(localStorage.getItem("my_rg_ug")||"{}"); }catch(e){ console.warn("Data lokal tidak terbaca, dimulai dari kosong.",e); data={}; }
data = data && typeof data==="object" && !Array.isArray(data) ? data : {};
data.jadwal = Array.isArray(data.jadwal) ? data.jadwal : [];
data.dok = Array.isArray(data.dok) ? data.dok : [];
data.keuangan = Array.isArray(data.keuangan) ? data.keuangan.filter(x=>x && Number.isFinite(Number(x.nominal))) : [];
data.informasi = data.informasi && typeof data.informasi==="object" && !Array.isArray(data.informasi) ? data.informasi : {};
["ilan","tarbiyyah","dakwah","tanmiyah"].forEach(k=>{if(!Array.isArray(data.informasi[k]))data.informasi[k]=[]});
data.administrasi = Array.isArray(data.administrasi) ? data.administrasi : [];
let mediaCache=[];

/* ===== Titik merah "ada data baru" (per perangkat) ===== */
const SEEN_KEY="my_rg_ug_seen";
const NAV_KEYS=["ilan","tarbiyyah","dakwah","tanmiyah","bendahara","sekretaris","jadwal","lpj","progker","struktur"];
const ADMIN_KATS={lpj:"LPJ",progker:"Program Kerja",struktur:"Struktur Kepengurusan"};
let seen=null;
try{ seen=JSON.parse(localStorage.getItem(SEEN_KEY)||"null"); }catch(e){ seen=null; }
if(!seen||typeof seen!=="object"||Array.isArray(seen)) seen={};
(function(){ const t0=Date.now(); let ch=false; NAV_KEYS.forEach(k=>{ if(!Number.isFinite(Number(seen[k]))){ seen[k]=t0; ch=true; } });
  if(ch){ try{localStorage.setItem(SEEN_KEY,JSON.stringify(seen))}catch(e){} } })();
function navItems(k){
  if(k==="bendahara") return data.keuangan;
  if(k==="sekretaris") return data.administrasi;
  if(k==="jadwal") return data.jadwal;
  if(ADMIN_KATS[k]) return data.administrasi.filter(x=>x&&x.kategori===ADMIN_KATS[k]);
  return data.informasi[k]||[];
}
function hasNewLainnya(){ return Object.keys(ADMIN_KATS).some(hasNew); }
function hasNew(k){ const s=Number(seen[k])||0; return navItems(k).some(x=>x && Number(x.ts)>s); }
function markSeen(k){
  let m=Date.now();
  navItems(k).forEach(x=>{ if(x && Number(x.ts)>m) m=Number(x.ts); });
  seen[k]=m;
  try{ localStorage.setItem(SEEN_KEY,JSON.stringify(seen)); }catch(e){}
}
function newDot(k){ return hasNew(k)?newDotRaw():''; }
function newDotRaw(){ return '<i class="ndot" role="img" aria-label="Ada data baru"></i>'; }

const DB_NAME="MyRGUGMediaDB",DB_VERSION=2,STORE="media",FILES="files";

function save(){
 try{ localStorage.setItem("my_rg_ug",JSON.stringify(data)); }
 catch(e){ console.warn("Cache lokal gagal disimpan:",e); if(!window.fb) alert("Data gagal disimpan. Penyimpanan browser mungkin penuh atau diblokir."); }
 pushRemote();
}

/* ===== Sinkronisasi realtime (Firebase Realtime Database) ===== */
const RT_KEYS=["jadwal","keuangan","administrasi","informasi/ilan","informasi/tarbiyyah","informasi/dakwah","informasi/tanmiyah"];
const remoteJson={};   /* JSON terakhir yang diketahui ada di server, per koleksi */
function getCol(k){ return k.startsWith("informasi/") ? data.informasi[k.slice(10)] : data[k]; }
function setCol(k,arr){ if(k.startsWith("informasi/")) data.informasi[k.slice(10)]=arr; else data[k]=arr; }
function toArr(v){ if(!v) return []; return (Array.isArray(v)?v:Object.values(v)).filter(x=>x&&typeof x==="object"); }
function pushRemote(){
 const fb=window.fb; if(!fb||!fb.db) return;
 RT_KEYS.forEach(k=>{
  if(!(k in remoteJson)) return;            /* belum sempat memuat data server, jangan menimpa */
  const arr=getCol(k)||[], j=JSON.stringify(arr);
  if(remoteJson[k]===j) return;             /* tidak ada perubahan di koleksi ini */
  const prev=remoteJson[k];
  remoteJson[k]=j;
  fb.set(fb.ref(fb.db,"data/"+k), arr.length?JSON.parse(j):null).catch(e=>{
   console.error("Gagal simpan ke server:",k,e);
   remoteJson[k]=prev;
   alert("Data gagal disimpan ke server. Pastikan sudah login dan koneksi internet aktif.");
  });
 });
}
let pendingRender=false;
function isTyping(){
 const a=document.activeElement, c=document.getElementById("content");
 return !!(a && c && c.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function rerenderView(){
 if(isTyping()){ pendingRender=true; return; }   /* jangan hapus ketikan yang sedang berjalan */
 if(!document.getElementById("login").classList.contains("hidden")) return;
 const y=window.scrollY;
 if(viewFn) viewFn(); else refreshDashboard();
 setTimeout(()=>window.scrollTo(0,y),80);
}
function startRealtime(){
 if(window.__rtStarted) return; window.__rtStarted=true;
 const fb=window.fb;
 RT_KEYS.forEach(k=>{
  fb.onValue(fb.ref(fb.db,"data/"+k),snap=>{
   let arr=toArr(snap.val());
   if(k==="keuangan") arr=arr.filter(x=>Number.isFinite(Number(x.nominal)));
   const j=JSON.stringify(arr);
   remoteJson[k]=j;
   if(JSON.stringify(getCol(k)||[])===j) return;   /* sama dengan yang tampil, tidak perlu render ulang */
   setCol(k,arr);
   try{ localStorage.setItem("my_rg_ug",JSON.stringify(data)); }catch(e){}
   rerenderView();
  },err=>console.warn("Gagal membaca data server ("+k+"):",err));
 });
 document.addEventListener("focusout",()=>{
  if(!pendingRender) return;
  setTimeout(()=>{ if(!isTyping()){ pendingRender=false; rerenderView(); } },300);
 });
 /* Pulihkan sesi login setelah aplikasi dibuka ulang */
 fb.onAuthStateChanged(fb.auth,async user=>{
  if(!user){ if(role!=="public") setPublicUI(); return; }
  if(role!=="public"||loginBusy) return;
  try{ const r=await fetchRole(user.uid); if(r&&role==="public"&&!loginBusy) enterRole(r); }
  catch(e){ console.warn("Gagal memulihkan sesi login:",e); }
 });
}
function rupiah(n){
 return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
}
let _dbp=null;
function openMediaDB(){
  if(_dbp) return _dbp;
  _dbp=new Promise((resolve,reject)=>{
   if(!("indexedDB" in window)){_dbp=null;reject(new Error("IndexedDB tidak tersedia"));return}
   const req=indexedDB.open(DB_NAME,DB_VERSION);
   req.onupgradeneeded=()=>{
    const db=req.result;
    if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
    if(!db.objectStoreNames.contains(FILES)) db.createObjectStore(FILES,{keyPath:"id"});
   };
   req.onsuccess=()=>{ const db=req.result; db.onversionchange=()=>{db.close();_dbp=null}; resolve(db); };
   req.onerror=()=>{_dbp=null;reject(req.error)};
   req.onblocked=()=>console.warn("Database lokal sedang dipakai tab lain. Tutup tab lain lalu muat ulang.");
  });
  return _dbp;
}
async function getMedia(){
 try{
  const db=await openMediaDB();
  return await new Promise((resolve,reject)=>{
   const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
   r.onsuccess=()=>resolve(r.result||[]);
   r.onerror=()=>reject(r.error);
  });
 }catch(e){return []}
}
async function addMediaFile(file){
 const db=await openMediaDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,"readwrite");
  const r=tx.objectStore(STORE).add({
   name:file.name,type:file.type,size:file.size,
   date:new Date().toLocaleDateString("id-ID"),blob:file
  });
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
async function deleteMedia(id){
 const db=await openMediaDB();
 return new Promise((resolve,reject)=>{
  const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);
  r.onsuccess=()=>resolve();
  r.onerror=()=>reject(r.error);
 });
}

async function refreshDashboard(){
 mediaCache=await getMedia();
 if(!document.getElementById("dashboard").classList.contains("hidden")){
   renderDashboard();
 }
}

async function fetchRole(uid){
 const snap=await window.fb.get(window.fb.ref(window.fb.db,"roles/"+uid));
 const r=snap.val();
 return (typeof r==="string" && Object.prototype.hasOwnProperty.call(bidang,r)) ? r : null;
}
let LOGIN_TIMEOUT=20000, ROLE_TIMEOUT=15000;
function withTimeout(p,ms,code){
  let tm;
  return Promise.race([p,new Promise((_,rej)=>{ tm=setTimeout(()=>rej(Object.assign(new Error(code),{code})),ms); })])
    .finally(()=>clearTimeout(tm));
}
async function login(){
  const err=document.getElementById("err"), btn=document.getElementById("btnLogin");
  if(loginBusy) return;
  const raw=document.getElementById("user").value.toLowerCase().trim();
  const p=document.getElementById("pass").value;
  if(!raw||!p){ err.textContent="Isi username dan password."; return; }
  if(!window.fb){ err.textContent="Belum tersambung ke server. Buka lewat link hosting (bukan dari WhatsApp), lalu coba lagi."; return; }
  const name=Object.prototype.hasOwnProperty.call(userAlias,raw)?userAlias[raw]:raw;
  const toEmail=n=>n.includes("@")?n:n+EMAIL_DOMAIN;
  const emails=[toEmail(name)]; if(toEmail(raw)!==emails[0]) emails.push(toEmail(raw));   /* cadangan: pakai nama yang diketik apa adanya */
  loginBusy=true; err.textContent="Memeriksa akun…";
  if(btn){ btn.disabled=true; btn.textContent="Memeriksa…"; }
  const badCred=c=>/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c);
  try{
   let cred=null, last=null;
   for(const em of emails){
    try{ cred=await withTimeout(window.fb.signIn(window.fb.auth,em,p),LOGIN_TIMEOUT,"login-timeout"); break; }
    catch(e){ last=e; if(!badCred(String((e&&e.code)||""))) throw e; }
   }
   if(!cred) throw last;
   err.textContent="Memeriksa peran…";
   let r;
   try{ r=await withTimeout(fetchRole(cred.user.uid),ROLE_TIMEOUT,"role-timeout"); }
   catch(e){ window.fb.signOut(window.fb.auth).catch(()=>{}); throw e; }
   if(!r){ await window.fb.signOut(window.fb.auth); err.textContent="Akun ini belum punya peran di database (node roles)."; return; }
   enterRole(r);
  }catch(e){
   console.error(e);
   const c=String((e&&e.code)||""), m=String((e&&e.message)||"");
   if(c==="login-timeout") err.textContent="Server login tidak merespons. Cek internet, matikan VPN/pemblokir iklan/mode hemat data, atau buka lewat Chrome/Safari (bukan browser dalam aplikasi), lalu coba lagi.";
   else if(c==="role-timeout") err.textContent="Login berhasil, tetapi data peran tidak terbaca. Cek Database URL dan Rules Realtime Database.";
   else if(c.includes("network")) err.textContent="Tidak ada koneksi internet.";
   else if(c.includes("PERMISSION")||/permission[_ ]denied/i.test(m)){ window.fb.signOut(window.fb.auth).catch(()=>{}); err.textContent="Peran belum bisa dibaca. Cek Rules Realtime Database."; }
   else if(c.includes("operation-not-supported")) err.textContent="Buka lewat alamat https (hosting), bukan dari file lokal.";
   else if(c.includes("operation-not-allowed")) err.textContent="Login Email/Password belum diaktifkan di Firebase (Authentication → Sign-in method).";
   else if(c.includes("too-many-requests")) err.textContent="Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.";
   else if(c.includes("user-disabled")) err.textContent="Akun ini dinonaktifkan di Firebase.";
   else if(c.includes("api-key")) err.textContent="API key Firebase tidak valid.";
   else if(badCred(c)) err.textContent="Username atau password salah.";
   else if(/offline/i.test(m)) err.textContent="Database tidak terjangkau. Cek Database URL dan koneksi internet.";
   else err.textContent="Login gagal"+(c?" ("+c+")":"")+". Coba lagi.";
  }finally{
   loginBusy=false;
   if(btn){ btn.disabled=false; btn.textContent="Masuk"; }
  }
}

function addJadwal(){
 if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menambah jadwal.");return}
 const j=document.getElementById("judul").value.trim(),t=document.getElementById("tanggal").value,p=document.getElementById("petugas").value.trim(),jenis=document.getElementById("jenis").value,tema=document.getElementById("tema").value.trim();

function hapusJadwalTombol(n){
  try{
    delJadwal(Number(n));
  }catch(err){
    alert("Terjadi kesalahan saat menghapus jadwal.");
    console.error(err);
  }
  return false;
}

function delJadwal(n){
  if(role!=="admin" && role!=="sekretaris"){
    alert("Hanya Admin atau Sekretaris yang dapat menghapus jadwal.");
    return;
  }
  n = Number(n);
  if(!Number.isInteger(n) || n < 0 || n >= data.jadwal.length){
    alert("Jadwal tidak ditemukan.");
    return;
  }
  if(!confirm("Hapus jadwal ini? Notifikasi jadwal tersebut juga akan ikut dihapus.")) return;
  data.jadwal.splice(n, 1);
  save();
  renderJadwal();
  refreshDashboard();
}

let mediaUrls=[];

  mediaUrls.forEach(u=>URL.revokeObjectURL(u));mediaUrls=[];
 const cards=mediaCache.length?mediaCache.map(x=>{

  const isVideo=String(x.type||"").startsWith("video/");
  return `<div class="media-card">
   ${isVideo?`<video src="${url}" controls preload="metadata"></video>`:`<img src="${url}" alt="${escapeHtml(x.name)}">`}
   <div class="media-meta">
    <b>${escapeHtml(x.name)}</b><small>${escapeHtml(x.date)} · ${isVideo?"Video":"Foto"}</small>
    ${can?`<button class="btn danger" style="margin-top:7px;width:100%" onclick="removeMedia(${x.id})">Hapus</button>`:""}

 }).join(""):"<p class='muted'>Belum ada foto/video yang diarsipkan.</p>";

/* ===== Arsip administrasi + lampiran PDF ===== */
const PDF_MAX=8*1024*1024;      /* batas ukuran PDF: 8 MB */
const CHUNK=400*1024;           /* potongan base64 per tulis ke server (kelipatan 4) */
let adminFile=null, adminBusy=false, adminMsg="", pdfBusy=false;
let adminDraft={kat:"",judul:"",isi:""};

function fmtSize(b){ b=Number(b)||0; return b<1048576 ? Math.max(1,Math.round(b/1024))+" KB" : (b/1048576).toFixed(1)+" MB"; }
function isPdf(f){ return !!f && (f.type==="application/pdf" || /\.pdf$/i.test(f.name||"")); }
function safeId(v){ return /^[a-z0-9]{6,40}$/i.test(String(v||"")) ? String(v) : ""; }
function newFileId(){ return "f"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

function blobToB64(blob){
  return new Promise((res,rej)=>{
   const r=new FileReader();
   r.onload=()=>{ const s=String(r.result); res(s.slice(s.indexOf(",")+1)); };
   r.onerror=()=>rej(r.error||new Error("Gagal membaca file"));
   r.readAsDataURL(blob);
  });
}
function b64ToBytes(s){ const bin=atob(s), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

/* penyimpanan lokal (IndexedDB) */
async function putFileLocal(id,blob,name){
  const db=await openMediaDB();
  return new Promise((res,rej)=>{
   const tx=db.transaction(FILES,"readwrite");
   tx.objectStore(FILES).put({id,name,type:"application/pdf",blob});
   tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error("Penyimpanan lokal dibatalkan"));
  });
}
async function getFileLocal(id){
  try{
   const db=await openMediaDB();
   return await new Promise((res,rej)=>{ const r=db.transaction(FILES,"readonly").objectStore(FILES).get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; }
}
async function delFileLocal(id){
  try{
   const db=await openMediaDB();
   await new Promise((res,rej)=>{ const tx=db.transaction(FILES,"readwrite"); tx.objectStore(FILES).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  }catch(e){}
}

/* penyimpanan server (Realtime Database, dipotong-potong agar aman) */
async function uploadFileRemote(id,blob,onProgress){
  const fb=window.fb; if(!fb||!fb.db) throw new Error("offline");
  const b64=await blobToB64(blob);
  const parts=[]; for(let i=0;i<b64.length;i+=CHUNK) parts.push(b64.slice(i,i+CHUNK));
  try{
   for(let i=0;i<parts.length;i++){
    await fb.set(fb.ref(fb.db,"data/files/"+id+"/c"+i),parts[i]);
    if(onProgress) onProgress(i+1,parts.length);
   }
   await fb.set(fb.ref(fb.db,"data/files/"+id+"/n"),parts.length);   /* penanda "lengkap", ditulis terakhir */
  }catch(e){
   try{ await fb.set(fb.ref(fb.db,"data/files/"+id),null); }catch(_){}
   throw e;
  }
}
async function loadPdfBlob(x){
  const id=safeId(x.fileId); if(!id) throw new Error("notfound");
  const rec=await getFileLocal(id); if(rec&&rec.blob) return rec.blob;
  const fb=window.fb; if(!fb||!fb.db) throw new Error("offline");
  const snap=await fb.get(fb.ref(fb.db,"data/files/"+id));
  const v=snap.val(), n=v?Number(v.n):0;
  if(!n) throw new Error("notfound");
  const parts=[];
  for(let i=0;i<n;i++){ const c=v["c"+i]; if(typeof c!=="string") throw new Error("notfound"); parts.push(b64ToBytes(c)); }
  const blob=new Blob(parts,{type:"application/pdf"});
  putFileLocal(id,blob,x.fileName||"dokumen.pdf").catch(()=>{});   /* simpan salinan agar buka berikutnya cepat */
  return blob;
}

/* tampilan */
function setAdminStatus(m){
  adminMsg=m||"";
  const el=document.getElementById("adminStatus"); if(el) el.textContent=adminMsg;
  const b=document.getElementById("btnAdmin"); if(b){ b.disabled=adminBusy; b.textContent=adminBusy?"Menyimpan…":"Simpan Arsip"; }
}
function showPickedPdf(){
  const el=document.getElementById("adminPicked"); if(!el) return;
  el.innerHTML=adminFile?`<span class="inline-icon">${icon("document")}</span> ${escapeHtml(adminFile.name)} (${fmtSize(adminFile.size)}) <button type="button" class="linkbtn" onclick="clearAdminPdf()">Batal</button>`:"";
}
function clearAdminPdf(){ adminFile=null; const i=document.getElementById("adminPdf"); if(i) i.value=""; showPickedPdf(); }
function pickAdminPdf(inp){
  const f=inp.files&&inp.files[0];
  adminFile=null;
  if(f){
   if(!isPdf(f)){ alert("File harus berformat PDF."); inp.value=""; }
   else if(f.size===0){ alert("File PDF ini kosong atau rusak."); inp.value=""; }
   else if(f.size>PDF_MAX){ alert("Ukuran PDF maksimal "+fmtSize(PDF_MAX)+". File ini "+fmtSize(f.size)+"."); inp.value=""; }
   else adminFile=f;
  }
  showPickedPdf();
}

async function addAdmin(kategoriTetap){
  if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menambah arsip.");return}
  if(adminBusy) return;
  const selEl=document.getElementById("katAdmin");
  const kategori=kategoriTetap||(selEl?selEl.value:"Kegiatan"),
        j=document.getElementById("judulAdmin").value.trim(),
        i=document.getElementById("isiAdmin").value.trim();
  if(!j){alert("Nomor atau judul wajib diisi.");return}
  const f=adminFile;
  if(f){
   if(!isPdf(f)){alert("File harus berformat PDF.");return}
   if(f.size===0){alert("File PDF ini kosong atau rusak.");return}
   if(f.size>PDF_MAX){alert("Ukuran PDF maksimal "+fmtSize(PDF_MAX)+". File ini "+fmtSize(f.size)+".");return}
  }
  adminBusy=true; setAdminStatus(f?"Menyimpan PDF…":"Menyimpan…");
  const item={kategori,judul:j,isi:i,tanggal:new Date().toLocaleDateString("id-ID"),ts:Date.now()};
  let cloudFailed=false;
  try{
   if(f){
    const id=newFileId();
    let localOk=false, cloudOk=false;
    try{ await putFileLocal(id,f,f.name); localOk=true; }catch(e){ console.warn("Simpan lokal gagal:",e); }
    try{ await uploadFileRemote(id,f,(a,b)=>setAdminStatus("Mengunggah PDF… "+Math.round(a/b*100)+"%")); cloudOk=true; }
    catch(e){ console.warn("Unggah ke server gagal:",e); }
    if(!localOk && !cloudOk) throw new Error("PDF tidak dapat disimpan (penyimpanan lokal dan server sama-sama gagal).");
    item.fileId=id; item.fileName=f.name; item.fileSize=f.size; item.fileCloud=cloudOk;
    cloudFailed=!cloudOk;
   }
   data.administrasi.unshift(item);
   adminFile=null; adminDraft={kat:"",judul:"",isi:""};
   save();
  }catch(e){
   console.error(e);
   adminBusy=false; setAdminStatus("");
   alert("Arsip gagal disimpan. "+(f?"Coba buka aplikasi lewat Chrome (bukan dari dalam WhatsApp), pastikan sudah login dan internet aktif, lalu ulangi.":""));
   return;
  }
  adminBusy=false; adminMsg="";
  if(viewFn) viewFn(); else renderSekretaris();
  if(cloudFailed) alert("Arsip tersimpan, tetapi PDF belum terunggah ke server sehingga baru bisa dibuka di HP ini. Pastikan sudah login dan internet aktif, lalu tekan \"Unggah ulang\" pada arsip tersebut.");
}

async function retryUpload(id,btn){
  if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat mengunggah ulang.");return}
  const x=data.administrasi.find(a=>a&&a.fileId===id); if(!x||!safeId(id)) return;
  if(btn){btn.disabled=true;btn.textContent="Mengunggah…";}
  try{
   const rec=await getFileLocal(id);
   if(!rec||!rec.blob){ const er=new Error("nolocal"); throw er; }
   await uploadFileRemote(id,rec.blob);
   x.fileCloud=true; save(); renderSekretaris();
  }catch(e){
   console.error(e);
   alert(String(e&&e.message)==="nolocal" ? "Berkas aslinya tidak ada di HP ini. Hapus arsip ini lalu unggah PDF-nya lagi dari HP yang menyimpan file tersebut."
                                           : "Unggah ke server gagal. Pastikan sudah login dan internet aktif.");
   if(btn){btn.disabled=false;btn.textContent="Unggah ulang";}
  }
}

async function openPdf(id,dl,btn){
  if(pdfBusy) return;
  const x=data.administrasi.find(a=>a&&a.fileId===id); if(!x) return;
  pdfBusy=true;
  const old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="Memuat…";}
  let w=null;
  if(!dl){ try{ w=window.open("","_blank"); if(w) w.document.title="Memuat PDF…"; }catch(e){ w=null; } }
  try{
   const blob=await loadPdfBlob(x);
   const url=URL.createObjectURL(blob);
   if(!dl && w && !w.closed){ w.location.href=url; }
   else{
    const a=document.createElement("a");
    a.href=url; a.download=(x.fileName||"dokumen")+(/\.pdf$/i.test(x.fileName||"")?"":".pdf");
    document.body.appendChild(a); a.click(); a.remove();
   }
   setTimeout(()=>URL.revokeObjectURL(url),300000);
  }catch(e){
   console.error(e);
   if(w&&!w.closed) w.close();
   const m=String(e&&e.message);
   alert(m==="offline" ? "Belum tersambung ke server. Buka lewat link hosting dan pastikan internet aktif, lalu coba lagi."
        : m==="notfound" ? "File PDF tidak ditemukan di server. Kemungkinan Sekretaris belum berhasil mengunggahnya."
        : "PDF gagal dibuka. Coba lagi beberapa saat.");
  }finally{
   pdfBusy=false; if(btn){btn.disabled=false;btn.textContent=old;}
  }
}

function delAdmin(n){
  if(role!=="admin" && role!=="sekretaris"){alert("Hanya Admin atau Sekretaris yang dapat menghapus arsip.");return}
  const x=data.administrasi[n]; if(!x) return;
  const kat=x.kategori;
  if(!confirm("Hapus arsip ini"+(x.fileId?" beserta file PDF-nya":"")+"?")) return;
  data.administrasi.splice(n,1);
  save();
  const fid=safeId(x.fileId);
  if(fid){
   delFileLocal(fid);
   const fb=window.fb; if(fb&&fb.db) fb.set(fb.ref(fb.db,"data/files/"+fid),null).catch(e=>console.warn("Hapus file di server gagal:",e));
  }
  if(viewFn) viewFn(); else if(Object.values(ADMIN_KATS).includes(kat)) renderLainnya(); else renderSekretaris();
}

<script>
/* Jam & tanggal real-time di header */
(function(){
 var H=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],
     B=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"],
     Z={"-420":"WIB","-480":"WITA","-540":"WIT"};
 function p(n){return n<10?"0"+n:""+n}
 function tick(){
  var d=new Date(),t=document.getElementById("clockTime"),e=document.getElementById("clockDate");
  if(!t||!e)return;
  var z=Z[String(d.getTimezoneOffset())];
  t.innerHTML=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+(z?"<small>"+z+"</small>":"");
  e.textContent=H[d.getDay()]+", "+d.getDate()+" "+B[d.getMonth()]+" "+d.getFullYear();
 }
 tick();setInterval(tick,1000);
})();
</script>
